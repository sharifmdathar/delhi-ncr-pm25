model: stgcn
model_config:
  hidden_size: 64
  num_timesteps_input: 72
  num_timesteps_output: 48
  graph_type: "distance"  # distance, correlation, wind_aware, learned_adaptive
  use_relu: True
  dropout: 0.3
  learning_rate: 0.001
  batch_size: 64
  lr_scheduler: cosine

training:
  epochs: 60
  batch_size: 64
  lr: 0.001
  optimizer: adam
  grad_clip: 1.0
evaluation:
  horizons: [1, 3, 6, 12, 24, 48]
  metrics: ["mae", "rmse", "r2"]
seed: 42