model: gatv2_stgcn
model_config:
  hidden_size: 64
  num_gat_layers: 2
  num_heads: 4
  dropout: 0.3
  learning_rate: 0.001
  batch_size: 64
  lr_scheduler: cosine

training:
  epochs: 30
  batch_size: 64
  lr: 0.001
  optimizer: adam
evaluation:
  horizons: [1, 3, 6, 12, 24, 48]
  metrics: ["mae", "rmse", "r2"]
seed: 42