model: graph_wavenet
model_config:
  hidden_size: 64
  num_timesteps_input: 72
  num_timesteps_output: 48
  graph_type: "wind_aware"  # distance, correlation, wind_aware, learned_adaptive
  residual_channels: 32
  dilation_channels: 32
  skip_channels: 64
  end_channels: 128
  blocks: 2
  layers: 4
  dropout: 0.3
  learning_rate: 0.001
  batch_size: 64
  lr_scheduler: cosine

training:
  epochs: 60
  batch_size: 64
  lr: 0.001
  optimizer: adam
  grad_clip: 1.0
evaluation:
  horizons: [1, 3, 6, 12, 24, 48]
  metrics: ["mae", "rmse", "r2"]
seed: 42